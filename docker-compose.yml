services:
  sync-me-maybe:
    image: ghcr.io/artamrj/sync-me-maybe:${SYNC_ME_MAYBE_VERSION:-latest}
    container_name: sync-me-maybe
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:-}
      MUSIC_DIR: ${MUSIC_DIR:-/music}
      DOWNLOAD_TMP_DIR: ${DOWNLOAD_TMP_DIR:-/tmp/sync-me-maybe}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      MAX_DOWNLOAD_SECONDS: ${MAX_DOWNLOAD_SECONDS:-900}
      MAX_COLLECTION_TRACKS: ${MAX_COLLECTION_TRACKS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${HOST_MUSIC_DIR:-./music}:/music
      - ${HOST_TMP_DIR:-./tmp}:/tmp/sync-me-maybe
      # Optional: mount a cookies file if YTDLP_COOKIES_FILE points to it.
      # - ./cookies.txt:/cookies.txt:ro
